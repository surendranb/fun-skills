<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nite Owl Launderette - 2am</title>
<!-- SCALE: 288px = 1m (at the reference plane) -->
<!-- DATUM y=820 -->
<!-- ROOM: 4.60w x 7.00d x 3.00h -->
<!-- SPAN width: bank-left=0.80 aisle=3.00 bank-right=0.80 -->
<!-- STYLE: painterly-perspective -->
<!-- PERSPECTIVE: horizon y=374, VP (620,374), s(y)=(y-374)/446  [F1: R=446=288*1.55 -> camera 1.55m, standing] -->
<!-- LIGHTS: t1=tube@300,120;axis=0;pool=pool-t1 | t2=tube@560,200;axis=0;pool=pool-t2 | t3=tube@700,248;axis=0;pool=pool-t3 | vend=area@1180,430;pool=pool-vend | shopfront=window@650,390;pool=pool-win -->
<!-- SIZES: washer=0.85x1.10 | washer-run=0.85x1.10 | washer-open=0.85x1.10 | washer-old=0.85x1.10 | washer-load=0.85x1.10 | bench=1.60x0.89 | cart=0.75x0.85 -->
<!-- PALETTE: #16202A #F2FBF6 #E8FFF4 #D7E4E0 #B3C6C3 #9FAFAE #6E8080 #C3D0D2 #8A9BA0 #5FBFA8 #2E7F72 #F2A63B #FFD79A #C97A3C #22303F #3E8C93 -->
<!--
  Stage 1 Brief: a 24-hour launderette, 2am, empty but for one person waiting.
  Mood "fluorescent insomnia". Star: the bank of washer drums, glass doors lit
  from inside. Signifiers (derived, >=6): front-loading washers in a wall bank
  with round glass doors; stacked dryers; a folding counter; moulded plastic
  chairs bolted in a row; wheeled laundry cart; coin/soap vending machine;
  ceiling fluorescent battens; taped paper notices; shopfront glazing onto a
  wet night street.
  Stage 2 Art direction (palette DERIVED, art-direction.md 2):
    light temp = cold fluorescent (cyan-green cast), no daylight at all;
    material truth = enamel+steel machines, speckled vinyl floor, painted block
    wall, moulded plastic seating, aluminium frames;
    identity accent = mint machine doors + ONE warm amber vending glow.
    Ink #16202A. Values: tubes + drum glass lightest, machines/wall mid,
    street + underbench darkest. Shadow tint cold slate #22303F.
    Framing element: foreground chair back, cropped bottom-left.
  Stage 3 World rules: no sun. Key = 3 ceiling battens (all light falls straight
    down, so every shadow is short and directly beneath). One warm accent = the
    vending machine. Sodium spill through the shopfront is the only exterior light.
  Stage 4 Coordinate map (k=288, s(y)=(y-374)/446):
    ceiling front 2.8m -> y14 | back wall top/bottom -> y244 / y535 (x 430..871)
    washer bank (left wall) base t=.18/.36/.54/.72 along the floor edge
    dryer stack (right wall) 1.7m | folding counter 0.9m | chair seat 0.45m
    floor datum -> y820 (foreground reference plane)
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#16202A; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  svg.scene { width:100vw; max-width:1440px; display:block; }
  .flick { animation:flick 5s ease-in-out infinite alternate; }
  @keyframes flick { from { opacity:.86; } to { opacity:1; } }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A 24-hour launderette at 2am: fluorescent battens over a bank of
     washing machines, one person waiting on moulded plastic chairs, a vending
     machine glowing amber, and a wet street beyond the shopfront glazing.">
<defs>
<linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D7E4E0"/><stop offset="55%" stop-color="#B3C6C3"/><stop offset="100%" stop-color="#8A9BA0"/></linearGradient>
<linearGradient id="ceilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B3C6C3"/><stop offset="60%" stop-color="#D7E4E0"/><stop offset="100%" stop-color="#F2FBF6"/></linearGradient>
<linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9FAFAE"/><stop offset="45%" stop-color="#B3C6C3"/><stop offset="100%" stop-color="#6E8080"/></linearGradient>
<linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F2FBF6"/><stop offset="45%" stop-color="#C3D0D2"/><stop offset="100%" stop-color="#8A9BA0"/></linearGradient>
<linearGradient id="streetG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16202A"/><stop offset="60%" stop-color="#22303F"/><stop offset="100%" stop-color="#3E8C93"/></linearGradient>
<radialGradient id="drumG"><stop offset="0%" stop-color="#F2FBF6"/><stop offset="42%" stop-color="#5FBFA8"/><stop offset="100%" stop-color="#2E7F72"/></radialGradient>

<radialGradient id="warmBloom"><stop offset="0%" stop-color="#FFD79A" stop-opacity=".75"/><stop offset="45%" stop-color="#F2A63B" stop-opacity=".22"/><stop offset="100%" stop-color="#F2A63B" stop-opacity="0"/></radialGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="sfr" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
