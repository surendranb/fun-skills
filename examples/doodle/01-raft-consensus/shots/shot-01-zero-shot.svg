<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Shot 1: Naive Zero-Shot LLM Output (Geometric Slop) -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#000000">RAFT CONSENSUS ALGORITHM</text>
  
  <!-- Client Box -->
  <rect x="60" y="320" width="160" height="120" fill="#0000ff" stroke="#000000" stroke-width="2" />
  <text x="140" y="385" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">CLIENT</text>
  
  <!-- Node A (Leader) -->
  <rect x="360" y="160" width="220" height="200" fill="#00ff00" stroke="#000000" stroke-width="2" />
  <text x="470" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Node A (Leader)</text>
  <rect x="390" y="230" width="160" height="40" fill="#ffff00" stroke="#000000" stroke-width="1" />
  <text x="470" y="255" font-family="Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">Log: [SET x=42]</text>
  <text x="470" y="310" font-family="Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">Term: 2</text>
  
  <!-- Node B (Follower) -->
  <rect x="760" y="160" width="220" height="200" fill="#ff0000" stroke="#000000" stroke-width="2" />
  <text x="870" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Node B (Follower)</text>
  <circle cx="870" cy="270" r="35" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="870" y="275" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Timer: 180ms</text>
  
  <!-- Node C (Follower) -->
  <rect x="560" y="480" width="220" height="200" fill="#ff0000" stroke="#000000" stroke-width="2" />
  <text x="670" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Node C (Follower)</text>
  <rect x="590" y="550" width="160" height="40" fill="#ffff00" stroke="#000000" stroke-width="1" />
  <text x="670" y="575" font-family="Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">Log: [SET x=42]</text>
  
  <!-- Straight Connector Lines -->
  <line x1="220" y1="380" x2="360" y2="260" stroke="#000000" stroke-width="2" />
  <polygon points="360,260 350,255 352,265" fill="#000000" />
  
  <line x1="580" y1="260" x2="760" y2="260" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="470" y1="360" x2="560" y2="480" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" />
  
  <rect x="940" y="660" width="200" height="80" fill="#e0e0e0" stroke="#000000" stroke-width="1" />
  <text x="1040" y="705" font-family="Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">Consensus Quorum: 2/3</text>
</svg>
