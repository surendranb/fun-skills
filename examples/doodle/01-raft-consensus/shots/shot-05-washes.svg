<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- PALETTE: bg=#ffffff ink=#001858 primary=#f582ae secondary=#8bd3dd accent=#f4d06f white=#ffffff -->
  <!-- Shot 5: Offset Watercolor Washes in Phase 2 Behind Ink -->
  
  <g id="phase-1-substrate">
    <rect width="100%" height="100%" fill="#ffffff" />
    <path d="M 28 32 Q 600 24 1172 30 Q 1178 400 1170 770 Q 600 776 30 768 Q 24 400 28 32" 
          fill="none" stroke="#001858" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />
  </g>

  <!-- PHASE 2: WASHES (Displaced 4-8px outside stroke lines) -->
  <g id="phase-2-washes">
    <!-- Header title wash (Amber highlight) -->
    <path d="M 282 50 Q 600 42 920 46 L 914 114 Q 596 122 276 112 Z" fill="#f4d06f" opacity="0.45" />
    
    <!-- Client container wash (Teal) -->
    <path d="M 64 244 Q 160 238 258 246 Q 262 380 254 516 Q 160 524 62 512 Z" fill="#8bd3dd" opacity="0.32" />
    
    <!-- Leader container wash (Coral / Pink - Hero Focal Element) -->
    <path d="M 346 164 Q 510 156 676 166 Q 682 290 674 416 Q 510 424 342 412 Z" fill="#f582ae" opacity="0.38" />
    
    <!-- Follower S2 wash (Teal) -->
    <path d="M 764 164 Q 930 156 1096 166 Q 1102 275 1094 386 Q 930 394 762 382 Z" fill="#8bd3dd" opacity="0.32" />
    
    <!-- Follower S3 wash (Teal) -->
    <path d="M 764 444 Q 930 436 1096 446 Q 1102 555 1094 666 Q 930 674 762 662 Z" fill="#8bd3dd" opacity="0.32" />
    
    <!-- Quorum Consensus Box wash (Amber) -->
    <path d="M 346 474 Q 510 466 676 476 Q 682 570 674 666 Q 510 674 342 662 Z" fill="#f4d06f" opacity="0.38" />
  </g>

