    <path d="M 758 438 Q 930 430 1102 440 Q 1108 550 1100 672 Q 928 680 756 668 Q 750 550 758 438 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Quorum Consensus Box -->
    <path d="M 338 468 Q 510 460 682 470 Q 688 565 680 672 Q 508 680 336 668 Q 330 565 338 468 Z" 
