  </g>

  <!-- PHASE 6: LETTERING -->
  <g id="phase-6-lettering" style="font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;">
    <text x="600" y="88" font-size="32" font-weight="bold" text-anchor="middle" fill="#001858">RAFT CONSENSUS ALGORITHM</text>
    <text x="160" y="278" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">1. Client Request</text>
    <text x="160" y="352" font-size="18" text-anchor="middle" fill="#001858">SET x = 42</text>
    <text x="510" y="200" font-size="26" font-weight="bold" text-anchor="middle" fill="#001858">Node S1 (Leader · Term 2)</text>
    <text x="510" y="272" font-size="18" text-anchor="middle" fill="#001858">Log: [Index 1: Term 2: x=42]</text>
    <text x="510" y="362" font-size="16" text-anchor="middle" fill="#001858">State: COMMITTED (Majority 2/3)</text>
    <text x="930" y="200" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">Node S2 (Follower)</text>
    <text x="930" y="480" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">Node S3 (Follower)</text>
    <text x="510" y="515" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">Quorum Consensus</text>
    <text x="510" y="565" font-size="18" text-anchor="middle" fill="#001858">Majority = (3 / 2) + 1 = 2 Nodes</text>
  </g>
</svg>
