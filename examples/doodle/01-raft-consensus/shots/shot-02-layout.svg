<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Shot 2: Structured Spatial Grid & Layout Architecture -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" />
  
  <!-- Header Wireframe -->
  <rect x="250" y="45" width="700" height="70" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="600" y="85" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">RAFT CONSENSUS ARCHITECTURE</text>
  
  <!-- Left Column: Client -->
  <rect x="60" y="240" width="200" height="280" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="160" y="275" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">[ 1. Client App ]</text>
  <rect x="80" y="320" width="160" height="50" fill="none" stroke="#999999" stroke-width="1" />
  <text x="160" y="350" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#666666">Write: SET x = 42</text>
  
  <!-- Center Column: Node A (Leader) -->
  <rect x="340" y="160" width="340" height="260" fill="none" stroke="#333333" stroke-width="2" />
  <text x="510" y="195" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">[ Node S1: LEADER (Term 2) ]</text>
  <rect x="365" y="230" width="290" height="65" fill="none" stroke="#666666" stroke-width="1" />
  <text x="510" y="265" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#444444">Replicated Log: [Index 1: x=42]</text>
  
  <!-- Right Column Top: Node B (Follower) -->
  <rect x="760" y="160" width="340" height="230" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="930" y="195" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">[ Node S2: FOLLOWER ]</text>
  <rect x="785" y="230" width="290" height="60" fill="none" stroke="#999999" stroke-width="1" />
  <text x="930" y="265" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#555555">Election Timer: 150-300ms</text>
  
  <!-- Right Column Bottom: Node C (Follower) -->
  <rect x="760" y="440" width="340" height="230" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="930" y="475" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">[ Node S3: FOLLOWER ]</text>
  <rect x="785" y="510" width="290" height="60" fill="none" stroke="#999999" stroke-width="1" />
  <text x="930" y="545" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#555555">Replicated Log: [Pending]</text>
  
  <!-- Bottom Banner: Consensus Quorum -->
  <rect x="340" y="470" width="340" height="200" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="510" y="510" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">[ Quorum Consensus ]</text>
  <text x="510" y="560" font-family="'Courier New', monospace" font-size="14" text-anchor="middle" fill="#555555">Majority = (N/2) + 1 = 2 of 3</text>
  <text x="510" y="600" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#777777">Commit confirmed when 2 nodes log entry</text>
</svg>
