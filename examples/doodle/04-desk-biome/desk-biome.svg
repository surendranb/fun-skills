    <path d="M 740 650 Q 730 600 760 590 Q 790 600 780 650 Q 760 660 740 650 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="760" cy="615" r="14" fill="#ffffff" stroke="#001858" stroke-width="2.2" />
    
    <!-- Coffee Mug -->
    <path d="M 260 635 L 262 580 Q 285 575 308 580 L 310 635 Q 285 642 260 635 Z" 
