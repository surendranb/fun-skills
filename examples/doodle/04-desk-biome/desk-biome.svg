    <path d="M 338 160 Q 600 154 862 158 L 860 422 Q 600 428 340 424 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 580 446 L 585 530 M 620 446 L 615 530" fill="none" stroke="#001858" stroke-width="3.5" />
    <ellipse cx="600" cy="530" rx="35" ry="10" fill="#ffffff" stroke="#001858" stroke-width="2.5" />
    
