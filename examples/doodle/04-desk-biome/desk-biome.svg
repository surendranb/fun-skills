    <path d="M 310 590 Q 330 590 330 610 Q 330 625 308 625" fill="none" stroke="#001858" stroke-width="2.2" />
    
    <!-- Open Field Notebook -->
    <path d="M 98 588 L 175 578 L 245 590 L 238 715 L 168 702 L 92 712 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 175 578 L 168 702" fill="none" stroke="#001858" stroke-width="2.0" />
    
    <!-- Sleeping Cat on Desk Mat -->
    <path d="M 850 640 Q 860 580 920 580 Q 980 580 1010 620 Q 1020 660 970 675 Q 910 680 860 665 Q 840 655 850 640 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="3.0" stroke-linecap="round" />
    <path d="M 865 595 L 855 575 L 880 585" fill="#ffffff" stroke="#001858" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 890 585 L 905 570 L 910 590" fill="#ffffff" stroke="#001858" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 870 615 Q 878 620 885 615 M 892 615 Q 900 620 908 615" fill="none" stroke="#001858" stroke-width="2.2" />
  </g>

  <!-- PHASE 5: STORYTELLING CONNECTORS -->
  <g id="phase-5-connectors">
    <path d="M 280 570 Q 270 545 285 530 Q 295 515 285 500" fill="none" stroke="#001858" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
    <path d="M 560 576 Q 560 550 500 550 Q 480 550 480 540 Q 480 530 500 530 Q 520 530 520 520" fill="none" stroke="#001858" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 855 620 L 830 615 M 855 625 L 830 630 M 915 620 L 940 615 M 915 625 L 940 630" fill="none" stroke="#001858" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 230 100 L 290 95 L 288 155 L 228 160 Z" fill="#ffffff" stroke="#001858" stroke-width="2" />
    <polygon points="250,90 270,88 268,102 248,104" fill="#f4d06f" opacity="0.8" />
    <path d="M 820 130 L 870 126 L 868 170 L 818 174 Z" fill="#ffffff" stroke="#001858" stroke-width="1.8" />
    <polygon points="835,120 855,118 853,132 833,134" fill="#f4d06f" opacity="0.8" />
  </g>

  <!-- PHASE 6: LETTERING & CODE TOKENS -->
  <g id="phase-6-lettering" style="font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;">
    <text x="600" y="86" font-size="34" font-weight="bold" text-anchor="middle" fill="#001858">THE MIDNIGHT DESK BIOME</text>
    <text x="600" y="125" font-size="18" text-anchor="middle" fill="#001858" opacity="0.8">02:15 AM · Agent Stack Live Trace · Chennai Biome</text>
    
    <!-- Code on Monitor -->
    <text x="360" y="200" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#001858">> agy run --autonomous</text>
    <text x="360" y="230" font-family="'JetBrains Mono', monospace" font-size="12" fill="#001858">⠋ Step 42: eval_doodle.py ...</text>
    <text x="360" y="255" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#001858">✔ STATUS: 100% PASS (0 AST errors)</text>
    <text x="360" y="285" font-family="'JetBrains Mono', monospace" font-size="12" fill="#001858">Git commit: [fun-skills 437e7ed]</text>
    <text x="360" y="310" font-family="'JetBrains Mono', monospace" font-size="12" fill="#001858">Linear SUR-293: closed with RCA</text>
    <text x="360" y="350" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#001858">"Never claim — verify."</text>
    
    <!-- Post-it Note -->
    <text x="844" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#001858">Ship today!</text>
    
    <!-- Polaroid Label -->
    <text x="258" y="150" font-size="11" text-anchor="middle" fill="#001858">Kyoto 2025</text>
    
    <!-- Callout Annotations -->
    <!-- Coffee -->
    <path d="M 230 540 Q 250 545 270 560" fill="none" stroke="#001858" stroke-width="1.2" stroke-linecap="round" />
    <text x="210" y="535" font-size="15" text-anchor="end" fill="#001858">single-origin V60</text>
    
    <!-- Cat -->
    <path d="M 940 565 Q 930 550 910 550" fill="none" stroke="#001858" stroke-width="1.2" stroke-linecap="round" />
    <text x="910" y="545" font-size="15" text-anchor="middle" fill="#001858">co-pilot in deep REM</text>
    <text x="975" y="615" font-size="15" font-weight="bold" fill="#001858">Zzz...</text>
    
    <!-- Keyboard -->
    <text x="560" y="715" font-size="15" text-anchor="middle" fill="#001858">custom split ergo 65% + lubricated holy pandas</text>
    
    <!-- Notebook -->
    <text x="165" y="735" font-size="14" text-anchor="middle" fill="#001858">f(t) = d_bow + ε</text>
