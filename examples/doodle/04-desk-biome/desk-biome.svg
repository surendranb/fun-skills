    <!-- Mechanical Keyboard -->
    <path d="M 418 578 Q 560 572 702 576 Q 706 630 700 682 Q 560 688 416 684 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 435 595 L 685 595 M 435 615 L 685 615 M 435 635 L 685 635 M 435 655 L 685 655" 
