<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- PALETTE: bg=#fef6e4 ink=#001858 primary=#f582ae secondary=#8bd3dd accent=#f4d06f white=#ffffff -->
  <!-- Shot 8: Complete Masterpiece with Declarative Zero-JS GPU Paper Shaders -->

  <defs>
    <!-- Cotton-Rag Archival Paper Shader -->
    <filter id="paper-texture-desk" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fef6e4" surfaceScale="2" diffuseConstant="1.1" result="light">
        <feDistantLight azimuth="55" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Hand-Drawn Stroke Jitter -->
    <filter id="sketch-stroke-desk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.04" numOctaves="3" seed="52" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Watercolor Wash Bleed -->
    <filter id="watercolor-wash-desk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="73" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.0" />
    </filter>
  </defs>

  <!-- PHASE 1: SUBSTRATE -->
  <g id="phase-1-substrate">
    <rect width="100%" height="100%" fill="#fef6e4" filter="url(#paper-texture-desk)" />
    <!-- Outer Hand-Drawn Double Border -->
    <path d="M 28 32 Q 600 24 1172 30 Q 1178 400 1170 770 Q 600 776 30 768 Q 24 400 28 32" 
          fill="none" stroke="#001858" stroke-width="1.8" opacity="0.30" stroke-linecap="round" />
    <path d="M 34 38 Q 600 32 1166 36 Q 1172 400 1164 764 Q 600 770 36 762 Q 30 400 34 38" 
          fill="none" stroke="#001858" stroke-width="1.0" opacity="0.18" stroke-linecap="round" />
  </g>

  <!-- PHASE 2: WASHES -->
  <g id="phase-2-washes" filter="url(#watercolor-wash-desk)">
    <!-- Lamp Light Cone Wash -->
    <polygon points="250,200 680,680 180,680" fill="#f4d06f" opacity="0.25" />
    
    <!-- Desk Solid Wood Wash -->
    <path d="M 64 486 Q 600 478 1136 484 L 1132 742 Q 600 750 68 744 Z" fill="#f4d06f" opacity="0.30" />
    
    <!-- Felt Desk Mat Wash (Teal) -->
    <path d="M 226 526 Q 600 520 974 524 L 972 716 Q 600 722 228 718 Z" fill="#8bd3dd" opacity="0.35" />
    
    <!-- Monitor Bezel & Screen Wash -->
    <path d="M 324 146 Q 600 140 876 144 L 874 436 Q 600 442 328 438 Z" fill="#001858" opacity="0.10" />
    <path d="M 344 164 Q 600 158 856 162 L 854 416 Q 600 422 346 418 Z" fill="#8bd3dd" opacity="0.22" />
    
    <!-- Monstera Pot (Amber) & Leaves (Teal) -->
    <path d="M 974 556 L 984 474 Q 1030 468 1076 474 L 1086 556 Z" fill="#f4d06f" opacity="0.50" />
    <path d="M 950 330 Q 1030 310 1080 340 Q 1060 410 1020 460 Z" fill="#8bd3dd" opacity="0.45" />
    <path d="M 1030 460 Q 1090 400 1120 420 Q 1100 460 1040 470 Z" fill="#8bd3dd" opacity="0.45" />
    <path d="M 1030 460 Q 940 410 920 440 Q 940 470 1010 470 Z" fill="#8bd3dd" opacity="0.45" />
    
    <!-- Sleeping Cat Wash (Pink) -->
    <path d="M 856 636 Q 866 584 924 584 Q 976 584 1004 624 Q 1014 656 966 670 Q 914 676 864 660 Z" fill="#f582ae" opacity="0.45" />
    
    <!-- Coffee Mug (Pink) & Notebook (Amber) -->
    <path d="M 264 630 L 266 584 Q 285 578 304 584 L 306 630 Z" fill="#f582ae" opacity="0.50" />
    <path d="M 104 592 L 172 584 L 238 594 L 232 710 L 166 698 L 98 706 Z" fill="#f4d06f" opacity="0.40" />
    
    <!-- Post-it Note (Yellow) & Polaroid Photo (Pink) -->
    <polygon points="820,130 870,126 868,170 818,174" fill="#f4d06f" opacity="0.75" />
    <polygon points="230,100 290,95 288,155 228,160" fill="#f582ae" opacity="0.40" />
  </g>

  <!-- PHASE 3: ACCENTS -->
  <g id="phase-3-accents">
    <path d="M 420 102 Q 600 108 780 100" fill="none" stroke="#f582ae" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="760" cy="615" r="4" fill="#f582ae" />
  </g>

