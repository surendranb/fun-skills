  <text x="600" y="60" font-family="'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#666666">[ COMPOSITION BLUEPRINT: MIDNIGHT DESK BIOME ]</text>
  
  <!-- Desk Surface Wireframe -->
