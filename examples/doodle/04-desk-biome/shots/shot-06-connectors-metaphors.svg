  <!-- PHASE 6: LETTERING -->
  <g id="phase-6-lettering" style="font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;">
    <text x="600" y="88" font-size="34" font-weight="bold" text-anchor="middle" fill="#001858">THE MIDNIGHT DESK BIOME</text>
  </g>
</svg>
