  <rect x="60" y="240" width="220" height="260" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="170" y="275" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">[ 1. Perception Stream ]</text>
  <rect x="80" y="320" width="180" height="50" fill="none" stroke="#999999" stroke-width="1" />
  <text x="170" y="350" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#666666">User Prompt &amp; Events</text>
  
  <!-- Center: Planner / Reasoning Core (The Star) -->
  <rect x="340" y="160" width="340" height="260" fill="none" stroke="#333333" stroke-width="2" />
  <text x="510" y="195" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">[ 2. Reasoning Core (Star) ]</text>
  <rect x="360" y="250" width="300" height="130" fill="none" stroke="#666666" stroke-width="1" />
