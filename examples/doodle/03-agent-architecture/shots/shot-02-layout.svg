<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Shot 2: Structured Spatial Grid & Layout Architecture -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" />
  
  <rect x="250" y="45" width="700" height="70" fill="none" stroke="#666666" stroke-width="1.5" />
  <text x="600" y="85" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">AI AGENT: STAR-MEMORY TOPOLOGY</text>
  
