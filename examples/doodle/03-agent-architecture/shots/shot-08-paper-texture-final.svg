    <path d="M 284 348 Q 310 320 334 320" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 318 308 L 338 320 L 318 332" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    
