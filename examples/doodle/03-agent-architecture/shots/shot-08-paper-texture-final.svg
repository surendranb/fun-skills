<svg viewBox="0 0 1200 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- PALETTE: bg=#fef6e4 ink=#001858 primary=#f582ae secondary=#8bd3dd accent=#f4d06f white=#ffffff -->
  <!-- Shot 8: Complete Masterpiece with Declarative Zero-JS GPU Paper Shaders -->

  <defs>
    <!-- Cotton-Rag Archival Paper Shader -->
    <filter id="paper-texture-agent" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fef6e4" surfaceScale="2" diffuseConstant="1.1" result="light">
        <feDistantLight azimuth="55" elevation="45" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Hand-Drawn Stroke Jitter -->
    <filter id="sketch-stroke-agent" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.04" numOctaves="3" seed="44" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Watercolor Wash Bleed -->
    <filter id="watercolor-wash-agent" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="91" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="1.0" />
    </filter>
  </defs>

  <!-- PHASE 1: SUBSTRATE -->
  <g id="phase-1-substrate">
    <rect width="100%" height="100%" fill="#fef6e4" filter="url(#paper-texture-agent)" />
    <!-- Outer Hand-Drawn Double Border -->
    <path d="M 28 32 Q 600 24 1172 30 Q 1178 400 1170 770 Q 600 776 30 768 Q 24 400 28 32" 
          fill="none" stroke="#001858" stroke-width="1.8" opacity="0.30" stroke-linecap="round" />
    <path d="M 34 38 Q 600 32 1166 36 Q 1172 400 1164 764 Q 600 770 36 762 Q 30 400 34 38" 
          fill="none" stroke="#001858" stroke-width="1.0" opacity="0.18" stroke-linecap="round" />
  </g>

  <!-- PHASE 2: WASHES -->
  <g id="phase-2-washes" filter="url(#watercolor-wash-agent)">
    <!-- Header title wash (Amber highlight) -->
    <path d="M 270 48 Q 600 40 930 46 L 924 114 Q 596 122 264 112 Z" fill="#f4d06f" opacity="0.50" />
    
    <!-- 1. Perception Wash (Teal / Input Stream) -->
    <path d="M 64 244 Q 170 236 276 246 Q 282 370 274 496 Q 170 504 62 492 Z" fill="#8bd3dd" opacity="0.35" />
    
    <!-- 2. Planner Core Wash (Pink / Cognitive Engine) -->
    <path d="M 346 164 Q 510 156 676 166 Q 682 290 674 416 Q 510 424 342 412 Z" fill="#f582ae" opacity="0.38" />
    
    <!-- 3. Memory Vault Wash (Amber / Golden Archive) -->
    <path d="M 764 164 Q 930 156 1096 166 Q 1102 290 1094 416 Q 930 424 762 412 Z" fill="#f4d06f" opacity="0.40" />
    
    <!-- 4. Tool Sandbox Fleet Wash (Teal) -->
    <path d="M 64 474 Q 580 464 1096 474 Q 1102 580 1094 676 Q 580 686 62 674 Z" fill="#8bd3dd" opacity="0.30" />
    
    <!-- Tape strips -->
    <polygon points="130,225 190,220 188,236 128,241" fill="#f4d06f" opacity="0.65" />
    <polygon points="470,145 530,140 528,156 468,161" fill="#f4d06f" opacity="0.65" />
    <polygon points="880,145 940,140 938,156 878,161" fill="#f4d06f" opacity="0.65" />
    
    <!-- Sub-tool washes -->
    <path d="M 94 544 Q 200 538 306 544 L 302 626 Q 200 632 98 626 Z" fill="#f4d06f" opacity="0.45" />
    <path d="M 354 544 Q 460 538 566 544 L 562 626 Q 460 632 358 626 Z" fill="#f582ae" opacity="0.45" />
    <path d="M 614 544 Q 720 538 826 544 L 822 626 Q 720 632 618 626 Z" fill="#8bd3dd" opacity="0.45" />
    <path d="M 874 544 Q 970 538 1066 544 L 1062 626 Q 970 632 878 626 Z" fill="#f4d06f" opacity="0.45" />
  </g>

  <!-- PHASE 3: ACCENTS -->
