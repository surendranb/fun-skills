    <path d="M 684 220 Q 720 200 754 215" fill="none" stroke="#001858" stroke-width="3.0" stroke-linecap="round" />
    <path d="M 740 202 L 758 216 L 736 228" fill="none" stroke="#001858" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 758 350 Q 720 370 684 355" fill="none" stroke="#001858" stroke-width="3.0" stroke-linecap="round" />
    <path d="M 700 368 L 682 354 L 704 342" fill="none" stroke="#001858" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Core -> Tool Sandbox Loop -->
    <path d="M 450 422 Q 430 445 450 466" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 440 452 L 452 468 L 464 452" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 570 466 Q 590 445 570 422" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 560 436 L 570 420 L 580 436" fill="none" stroke="#001858" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PHASE 6: LETTERING -->
  <g id="phase-6-lettering" style="font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;">
    <text x="600" y="86" font-size="34" font-weight="bold" text-anchor="middle" fill="#001858">AUTONOMOUS AGENT: STAR-MEMORY LOOP</text>
    <text x="600" y="142" font-size="19" font-weight="600" text-anchor="middle" fill="#001858" opacity="0.85">Perception · Autoregressive Planning Core · Episodic Memory Vault · MCP Tool Fleet</text>
    
    <!-- 1. Perception -->
    <text x="170" y="278" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">1. Perception Stream</text>
    <text x="170" y="352" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" fill="#001858">USER_PROMPT</text>
    <text x="170" y="415" font-size="15" text-anchor="middle" fill="#001858">Token Rate Limiter</text>
    <text x="170" y="440" font-size="14" text-anchor="middle" fill="#001858" opacity="0.8">Context Packager</text>
    <text x="170" y="465" font-size="14" text-anchor="middle" fill="#001858" opacity="0.8">System Prompt Injection</text>
    
    <!-- 2. Planner Core -->
