    <path d="M 90 540 Q 200 534 310 540 Q 314 580 308 630 Q 198 636 88 630 Z" fill="#ffffff" stroke="#001858" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 350 540 Q 460 534 570 540 Q 574 580 568 630 Q 458 636 348 630 Z" fill="#ffffff" stroke="#001858" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 610 540 Q 720 534 830 540 Q 834 580 828 630 Q 718 636 608 630 Z" fill="#ffffff" stroke="#001858" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 870 540 Q 970 534 1070 540 Q 1074 580 1068 630 Q 968 636 868 630 Z" fill="#ffffff" stroke="#001858" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
  </g>

