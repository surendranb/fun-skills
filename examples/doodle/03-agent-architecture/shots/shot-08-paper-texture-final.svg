    <text x="510" y="238" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" fill="#001858">PLANNER_RESPONSE</text>
    <text x="510" y="280" font-size="16" text-anchor="middle" fill="#001858">Chain-of-Thought (CoT)</text>
    <text x="510" y="305" font-size="15" text-anchor="middle" fill="#001858">Deterministic Verification</text>
    <text x="510" y="330" font-size="15" text-anchor="middle" fill="#001858">Self-Correction Feedback Loop</text>
    <text x="510" y="395" font-size="15" font-weight="bold" text-anchor="middle" fill="#001858">"Stop on first broken assertion!"</text>
    
    <!-- 3. Memory Vault -->
    <text x="930" y="196" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">3. Memory Vault</text>
    <text x="930" y="238" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" fill="#001858">EPISODIC_RAG</text>
    <text x="930" y="280" font-size="16" text-anchor="middle" fill="#001858">Vector Embeddings</text>
    <text x="930" y="305" font-size="15" text-anchor="middle" fill="#001858">Obsidian Brain Notes</text>
    <text x="930" y="330" font-size="15" text-anchor="middle" fill="#001858">Compounding Experience</text>
    <text x="930" y="395" font-size="15" font-weight="bold" text-anchor="middle" fill="#001858">"Never repeat past mistakes"</text>
    
    <!-- 4. Tool Sandbox Fleet -->
    <text x="580" y="508" font-size="24" font-weight="bold" text-anchor="middle" fill="#001858">4. Model Context Protocol (MCP) &amp; Execution Sandbox</text>
    
    <text x="200" y="572" font-size="18" font-weight="bold" text-anchor="middle" fill="#001858">Local Filesystem</text>
    <text x="200" y="600" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle" fill="#001858">git, ast, diff</text>
    
    <text x="460" y="572" font-size="18" font-weight="bold" text-anchor="middle" fill="#001858">Terminal Sandbox</text>
    <text x="460" y="600" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle" fill="#001858">isolated zsh shell</text>
    
    <text x="720" y="572" font-size="18" font-weight="bold" text-anchor="middle" fill="#001858">Remote MCP Fleet</text>
    <text x="720" y="600" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle" fill="#001858">Linear, DB, BigQuery</text>
    
    <text x="970" y="572" font-size="18" font-weight="bold" text-anchor="middle" fill="#001858">Headless Browser</text>
    <text x="970" y="600" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle" fill="#001858">Chrome DevTools</text>
    
    <text x="580" y="662" font-size="16" font-style="italic" text-anchor="middle" fill="#001858">Action Loop: Tool Execution ➜ Structured Observation ➜ Reactive Wakeup</text>
