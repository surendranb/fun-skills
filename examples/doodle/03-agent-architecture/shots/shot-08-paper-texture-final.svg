    <path d="M 80 320 Q 170 314 260 320 Q 264 348 258 376 Q 168 382 78 376 Q 76 348 80 320 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="2.0" stroke-linecap="round" />
    
    <!-- 2. Planner (Hero) -->
    <path d="M 338 158 Q 510 150 682 160 Q 688 285 680 422 Q 508 430 336 418 Q 330 285 338 158 Z" 
          fill="#ffffff" stroke="#001858" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 336 160 Q 510 152 684 158 Q 686 285 678 420 Q 508 428 334 416 Z" 
          fill="none" stroke="#001858" stroke-width="1.2" opacity="0.45" stroke-linecap="round" />
    <path d="M 360 250 Q 510 244 660 250 Q 664 300 658 350 Q 508 356 358 350 Z" 
