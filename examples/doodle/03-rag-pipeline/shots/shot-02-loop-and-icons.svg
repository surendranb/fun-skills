  <!-- PHASE 6: LETTERING -->
  <g id="phase-6-lettering" style="font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;">
    <text x="600" y="78" text-anchor="middle" font-size="56" font-weight="700" fill="#001858">How RAG Works</text>
    <text x="600" y="112" text-anchor="middle" font-size="24" fill="#001858" opacity="0.85">answering questions from your own private library</text>

    <text x="160" y="298" text-anchor="middle" font-size="28" font-weight="600" fill="#001858">Your Question</text>
    <text x="142" y="258" text-anchor="middle" font-size="30" font-weight="600" fill="#001858">?</text>
    <text x="455" y="296" text-anchor="middle" font-size="28" font-weight="600" fill="#001858">The Embedder</text>
    <text x="775" y="200" text-anchor="middle" font-size="28" font-weight="600" fill="#001858">The Vector Library</text>
    <text x="1067" y="302" text-anchor="middle" font-size="23" font-weight="600" fill="#001858">The LLM Brain</text>
    <text x="594" y="636" text-anchor="middle" font-size="30" font-weight="600" fill="#001858">Grounded Answer</text>

    <text x="308" y="237" text-anchor="middle" font-size="18" fill="#001858">1</text>
    <text x="604" y="233" text-anchor="middle" font-size="18" fill="#001858">2</text>
    <text x="952" y="235" text-anchor="middle" font-size="18" fill="#001858">3</text>
    <text x="948" y="465" text-anchor="middle" font-size="18" fill="#001858">4</text>
    <text x="280" y="541" text-anchor="middle" font-size="18" fill="#001858">5</text>

    <text x="455" y="330" text-anchor="middle" font-size="17" fill="#001858" opacity="0.8">meaning, not keywords</text>
    <text x="775" y="296" text-anchor="middle" font-size="20" font-family="'JetBrains Mono', monospace" fill="#001858">top-k = 4 chunks</text>
    <text x="1067" y="348" text-anchor="middle" font-size="17" fill="#001858" opacity="0.8">reads only what it is handed</text>
    <text x="594" y="700" text-anchor="middle" font-size="20" fill="#001858" opacity="0.9">the library remembers what the model never read</text>
    <text x="238" y="470" text-anchor="middle" font-size="19" fill="#f582ae" transform="rotate(-52 238 470)" opacity="0.95">cite your receipts</text>
  </g>
</svg>
