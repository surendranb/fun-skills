<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 2: Shot 01 - Zero Shot Clip Art</title>
  <style>body { margin: 0; background: #fff; display: flex; justify-content: center; }</style>
</head>
<body>
  <!-- Shot 1: Naive Zero-Shot LLM Output for Coffee Shop Interior -->
  <svg viewBox="0 0 1440 900" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <!-- Unscaled, floating geometry without metric datum -->
    <rect width="100%" height="100%" fill="#f0e68c" />
    <rect x="0" y="500" width="1440" height="400" fill="#8b4513" />
    
    <!-- Floating window -->
    <rect x="100" y="100" width="300" height="200" fill="#87ceeb" stroke="#000" stroke-width="4" />
    
    <!-- Floating Counter -->
    <rect x="200" y="400" width="1000" height="150" fill="#d2691e" stroke="#000" stroke-width="4" />
    
    <!-- Coffee Pot -->
    <rect x="400" y="320" width="80" height="80" fill="#cd7f32" stroke="#000" stroke-width="3" />
    <polygon points="400,340 360,320 370,350" fill="#cd7f32" stroke="#000" stroke-width="2" />
    
    <!-- Floating Cups -->
    <circle cx="600" cy="360" r="30" fill="#fff" stroke="#000" stroke-width="3" />
    <circle cx="700" cy="360" r="30" fill="#fff" stroke="#000" stroke-width="3" />
    
    <!-- Floating Stools without contact physics -->
    <rect x="350" y="520" width="60" height="120" fill="#8b0000" stroke="#000" stroke-width="3" />
    <rect x="650" y="520" width="60" height="120" fill="#8b0000" stroke="#000" stroke-width="3" />
    <rect x="950" y="520" width="60" height="120" fill="#8b0000" stroke="#000" stroke-width="3" />
    
    <text x="720" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#000">KYOTO COFFEE SHOP</text>
  </svg>
</body>
</html>
