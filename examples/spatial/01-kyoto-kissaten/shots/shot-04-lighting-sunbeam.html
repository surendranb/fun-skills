<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 2: Shot 04 - Sunlight Beam & Floor Pool</title>
  <style>body { margin: 0; background: #fff; display: flex; justify-content: center; }</style>
</head>
<body>
  <svg viewBox="0 0 1440 900" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <!-- PHASE 1: ENVELOPE -->
    <g id="phase-1-envelope">
      <rect x="0" y="0" width="1440" height="720" fill="#f5ede0" />
      <rect x="0" y="720" width="1440" height="180" fill="#d8bda0" />
      <line x1="0" y1="740" x2="1440" y2="740" stroke="#c4a585" stroke-width="1.5" />

    <g id="phase-2-apertures">
      <rect x="80" y="120" width="300" height="586" fill="#e2ede8" />
      <path d="M 120 706 Q 125 400 130 120 M 160 706 Q 155 450 150 120 M 220 706 Q 225 350 230 120" stroke="#a3c4b5" stroke-width="6" opacity="0.6" stroke-linecap="round" />
      <rect x="80" y="120" width="300" height="586" fill="none" stroke="#4a3728" stroke-width="12" />
      <line x1="80" y1="220" x2="380" y2="220" stroke="#4a3728" stroke-width="3" />

      <line x1="80" y1="620" x2="380" y2="620" stroke="#4a3728" stroke-width="3" />
      <line x1="180" y1="120" x2="180" y2="706" stroke="#4a3728" stroke-width="3" />
      <line x1="280" y1="120" x2="280" y2="706" stroke="#4a3728" stroke-width="3" />
    </g>

    <!-- PHASE 3: FIXTURES -->
    <g id="phase-3-wall-fixtures">
      <rect x="440" y="140" width="36" height="130" fill="#c49a6c" stroke="#4a3728" stroke-width="1.5" />
      <rect x="490" y="140" width="36" height="130" fill="#c49a6c" stroke="#4a3728" stroke-width="1.5" />
      <rect x="540" y="140" width="36" height="130" fill="#c49a6c" stroke="#4a3728" stroke-width="1.5" />
      <rect x="590" y="140" width="36" height="130" fill="#c49a6c" stroke="#4a3728" stroke-width="1.5" />
      <rect x="640" y="140" width="36" height="130" fill="#c49a6c" stroke="#4a3728" stroke-width="1.5" />
      <text x="458" y="170" font-family="'Noto Serif JP', serif" font-size="12" text-anchor="middle" fill="#2d2118">珈</text>
      <text x="458" y="195" font-family="'Noto Serif JP', serif" font-size="12" text-anchor="middle" fill="#2d2118">琲</text>
      
      <rect x="800" y="130" width="80" height="160" fill="#5c4033" stroke="#2d2118" stroke-width="2" rx="4" />
      <circle cx="840" cy="180" r="30" fill="#fdfbf7" stroke="#b8860b" stroke-width="3" />
      <line x1="840" y1="180" x2="840" y2="162" stroke="#2d2118" stroke-width="2" />
      <line x1="840" y1="180" x2="855" y2="180" stroke="#2d2118" stroke-width="1.5" />
      <line x1="840" y1="210" x2="840" y2="265" stroke="#b8860b" stroke-width="2" />
      <circle cx="840" cy="265" r="10" fill="#d4af37" stroke="#b8860b" stroke-width="1" />
    </g>

    <!-- PHASE 4: LIGHTING (34° Morning Sunlight Angle) -->
    <g id="phase-4-lighting">
      <!-- Sunlight Volumetric Shaft -->
      <polygon points="120,120 380,120 900,900 480,900" fill="#fff9e6" opacity="0.22" />
      <!-- Floor Light Pool -->
      <ellipse cx="640" cy="810" rx="280" ry="60" fill="#fff3cc" opacity="0.30" />
    </g>
  </svg>
</body>
</html>
