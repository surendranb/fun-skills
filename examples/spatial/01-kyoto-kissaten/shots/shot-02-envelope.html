<!DOCTYPE html>

      <line x1="0" y1="860" x2="1440" y2="860" stroke="#c4a585" stroke-width="2.5" />
      
      <!-- Dark Cedar Baseboard Trim (y = 706 to 720) -->
      <rect x="0" y="706" width="1440" height="14" fill="#4a3728" />
